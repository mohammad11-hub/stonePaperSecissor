

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StonePaperScissors</title>
    <link rel="stylesheet"      href="StonePaperScissors.css">
</head>

<body>
    <h1>STONE PAPER SCISSOR GAME</h1>

    <div class="choices">
        <button id="stone">stone</button>
        <button id="paper">paper</button>
        <button id="Scissors">scissors</button>
    </div>
    <h2>PLAYER CHOICE</h2>
    <div class="choics">
        <div class="result" >
            <p id="uc">0</p>
            <p>player choices</p>
          </div>
          <div class="result" id="cchoices">
              <p id="cc">0</p>
              <p>comp choices</p>
            </div>
    </div>
    <h2>SCORE BORAD</h2>
    <div class="choics">

        <div class="result" >
          <p id="UserScore">0</p>
          <p>UserScore</p>
        </div>
        <div class="result" >
            <p id="TieScore">0</p>
            <p>TieScore</p>
          </div>
        <div class="result" >
            <p id="ComputerSore">0</p>
            <p>ComputerSore</p>
          </div>
       
    </div>
    <div id="result">

    </div>
    <script src="StonePaperScissors.js"></script>

</body>

</html>
